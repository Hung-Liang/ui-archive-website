<html>
  <head>

    <meta charset="UTF-8" />

    <title data-i18n="main_title">しぐれうい Youtube Archive</title>
    <meta name="description" content="Archive of Shigure Ui's YouTube streams and videos." />
    <meta property="og:title" content="しぐれうい Youtube Archive" />
    <meta property="og:description" content="Archive of Shigure Ui's YouTube streams and videos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ui-archive-website.bobing.dev/" />
    <meta property="og:image" content="https://ui-archive-website.bobing.dev/asset/icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="しぐれうい Youtube Archive" />
    <meta name="twitter:description" content="Archive of Shigure Ui's YouTube streams and videos." />
    <meta name="twitter:image" content="https://ui-archive-website.bobing.dev/asset/icon.png" />
    <link rel="icon" href="./asset/icon.png" type="image/png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#333333" />
    <script src="./scripts/theme.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              console.log("Service Worker registered with scope:", registration.scope);
            })
            .catch((error) => {
              console.log("Service Worker registration failed:", error);
            });
        });
      }

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
    <style>
      /* Month index: one row per year, the year label beside its months */
      .year-row {
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: start;
        gap: 16px;
        padding: 12px 0;
        border-top: 1px solid var(--rule);
      }
      .year-label {
        margin: 0;
        line-height: var(--control-height);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      li a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 64px;
        height: var(--control-height);
        padding: 0 12px;
        box-sizing: border-box;
        border-radius: var(--radius-control);
        background-color: var(--raised);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }
      li a:hover {
        background-color: var(--accent-soft);
        color: var(--accent-ink);
      }
      #list > ul {
        margin-top: 8px;
      }

      @media (max-width: 600px) {
        .year-row {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        li {
          flex-grow: 1;
        }
        li a {
          width: 100%;
          height: 44px; /* Larger tap target */
        }
      }
    </style>
  </head>
  <body>
    <img
      src="./asset/left_image.webp"
      alt="Left Decor Image"
      class="side-image left"
      width="1000"
      height="1000"
    />
    <img
      src="./asset/right_image.webp"
      alt="Right Decor Image"
      class="side-image right"
      width="1000"
      height="1000"
    />

    <div class="container">
      <header class="top-bar">
        <div class="top-bar-start">
          <a href="index.html" class="brand">
            <img src="./asset/icon.png" alt="" width="28" height="28" />
            しぐれうい
          </a>
        </div>
        <div class="top-bar-actions">
          <div class="language-selector">
            <select id="language-select" aria-label="Language"></select>
          </div>
          <button
            id="theme-toggle"
            class="theme-toggle-btn"
            title="切換深色模式"
            aria-label="切換深色模式"
          ></button>
          <a href="index.html" class="action-button" data-i18n="home_button"
            >Home</a
          >
          <button id="open-search-popup" class="search-button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <span data-i18n="search_stream_button">Search Stream</span>
          </button>
        </div>
      </header>

      <div class="page-title">
        <h1 data-i18n="main_title">しぐれうい</h1>
        <p id="archive-summary" class="page-subtitle"></p>
      </div>
      <div id="list">
        <!-- Skeleton Loaders -->
        <div class="skeleton-title" style="width: 30%; margin-top: 48px;"></div>
        <div class="skeleton-title" style="width: 15%; height: 20px; margin-top: 15px;"></div>
        <ul>
          <li class="skeleton-pill"></li>
          <li class="skeleton-pill"></li>
          <li class="skeleton-pill"></li>
        </ul>
        <div class="skeleton-title" style="width: 30%; margin-top: 48px;"></div>
        <div class="skeleton-title" style="width: 15%; height: 20px; margin-top: 15px;"></div>
        <ul>
          <li class="skeleton-pill"></li>
          <li class="skeleton-pill"></li>
          <li class="skeleton-pill"></li>
        </ul>
      </div>

      <div class="footer-info">
        <div id="last-update-info" class="last-update-info">
          <span data-i18n="last_updated">Last Updated</span>:
          <span id="last-update-date">Loading...</span>
        </div>
        <div class="developer-info">
          <span data-i18n="developer">Developer</span>:
          <a href="https://github.com/Hung-Liang" target="_blank">Hung-Liang</a>
        </div>
      </div>
    </div>

    <div id="search-popup-overlay">
      <div id="search-popup-content">
        <span id="close-search-popup" role="button" aria-label="Close">×</span>
        <h2 data-i18n="search_stream_popup_title">Search Stream</h2>
        <input
          type="text"
          id="popup-search-input"
          data-i18n-placeholder="search_stream_placeholder"
          placeholder="Please enter stream title keywords"
        />
        <button
          id="perform-search-button"
          class="search-button"
          data-i18n="start_search_button"
        >
          Start Search
        </button>
      </div>
    </div>

    <script src="./scripts/language.js"></script>
    <script>
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      document.addEventListener("DOMContentLoaded", async () => {
        // Initialize language
        await loadTranslations();
        applyTranslations();

        const openSearchButton = document.getElementById("open-search-popup");
        const searchPopupOverlay = document.getElementById(
          "search-popup-overlay"
        );
        const closeSearchPopup = document.getElementById("close-search-popup");
        const popupSearchInput = document.getElementById("popup-search-input");
        const performSearchButton = document.getElementById(
          "perform-search-button"
        );
        const lastUpdateDateSpan = document.getElementById("last-update-date");

        fetch("data/index.json")
          .then((res) => res.json())
          .then((index) => {
            const container = document.getElementById("list");
            container.innerHTML = ""; // Clear skeleton loaders

            // Define the desired order of categories (Life first, then Gaming)
            const orderedCategories = ["videos"];

            // Iterate through categories in the specified order
            orderedCategories.forEach((category) => {
              // Check if the category actually exists in the index data
              if (!index[category]) {
                return; // Skip if category data is missing
              }

              const categoryTitle = document.createElement("h2");
              // Set category title based on category key
              if (category === "videos") {
                categoryTitle.setAttribute("data-i18n", "live_stream_archive");
              } else {
                categoryTitle.textContent = `${
                  category.charAt(0).toUpperCase() + category.slice(1)
                }`; // Fallback for other categories
              }
              container.appendChild(categoryTitle);

              // Define the desired order of sub-categories (Normal first, then Member)
              const orderedSubCategories = ["normal", "member"];

              // Iterate through sub-categories in the specified order
              orderedSubCategories.forEach((sub_category) => {
                // Check if the sub_category actually exists under the current category
                if (!index[category][sub_category]) {
                  return; // Skip if sub_category data is missing
                }

                const subCategoryTitle = document.createElement("h3");
                // Set sub-category title based on sub_category key
                if (sub_category === "normal") {
                  subCategoryTitle.setAttribute("data-i18n", "stream_category");
                } else if (sub_category === "member") {
                  subCategoryTitle.setAttribute(
                    "data-i18n",
                    "member_only_category"
                  );
                } else {
                  subCategoryTitle.textContent = `${
                    sub_category.charAt(0).toUpperCase() + sub_category.slice(1)
                  }`; // Fallback
                }
                container.appendChild(subCategoryTitle);

                const yearsData = index[category][sub_category];
                const years = Object.keys(yearsData).sort((a, b) => b - a); // Sort years descending

                years.forEach((year) => {
                  const yearRow = document.createElement("div");
                  yearRow.className = "year-row";
                  const yearText = document.createElement("p"); // Use p tag for year for now, can be h4
                  yearText.className = "year-label";
                  yearText.textContent = `${year}`;
                  yearRow.appendChild(yearText);
                  container.appendChild(yearRow);

                  const ul = document.createElement("ul");
                  yearsData[year]
                    .sort((a, b) => b - a) // Sort months descending
                    .forEach((month) => {
                      const li = document.createElement("li");
                      const monthNameKey = `month_${month}`;
                      // Add data-i18n attribute to the anchor tag
                      li.innerHTML = `<a href="./pages/month.html?cat=${escapeHtml(category)}&sub=${escapeHtml(sub_category)}&y=${escapeHtml(year)}&m=${escapeHtml(month)}" data-i18n="${escapeHtml(monthNameKey)}">${escapeHtml(
                        translations[currentLanguage][monthNameKey] ||
                        translations["en"][monthNameKey] ||
                        month
                      )}</a>`;
                      ul.appendChild(li);
                    });
                  yearRow.appendChild(ul);
                });
              });
            });

            let monthCount = 0;
            let firstYear = Infinity;
            Object.values(index).forEach((subCategories) => {
              Object.values(subCategories).forEach((yearsData) => {
                Object.entries(yearsData).forEach(([year, months]) => {
                  monthCount += months.length;
                  firstYear = Math.min(firstYear, Number(year));
                });
              });
            });
            if (monthCount > 0) {
              const summary = document.getElementById("archive-summary");
              summary.setAttribute("data-i18n", "archive_summary");
              summary.setAttribute(
                "data-i18n-vars",
                JSON.stringify({ year: firstYear, count: monthCount }),
              );
            }
            applyTranslations(); // Apply translations after dynamic content is added
          })
          .catch((error) => {
            console.error("Error fetching index.json:", error);
            document.getElementById("list").innerHTML =
              "<p class='list-message error' data-i18n='history_data_error'>Unable to load history data, please try again later.</p>";
            applyTranslations();
          });

        function formatLastUpdate(value) {
          // Older data has no timezone; it was written in UTC by GitHub Actions
          const hasTimezone = /(Z|[+-]\d{2}:?\d{2})$/i.test(value);
          const date = new Date(hasTimezone ? value : value.replace(" ", "T") + "Z");
          if (isNaN(date)) {
            return value;
          }
          return date.toLocaleString(undefined, {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          });
        }

        fetch("data/last_update.json")
          .then((res) => {
            if (!res.ok) {
              throw new Error(`HTTP error! status: ${res.status}`);
            }
            return res.json();
          })
          .then((data) => {
            if (data && data.last_update) {
              lastUpdateDateSpan.textContent = formatLastUpdate(data.last_update);
            } else {
              lastUpdateDateSpan.textContent = "Unable to load";
              lastUpdateDateSpan.setAttribute("data-i18n", "unable_to_load");
            }
            applyTranslations();
          })
          .catch((error) => {
            console.error("Error fetching last_update.json:", error);
            lastUpdateDateSpan.textContent = "Unable to load";
            lastUpdateDateSpan.setAttribute("data-i18n", "unable_to_load");
            applyTranslations();
          });

        openSearchButton.addEventListener("click", () => {
          searchPopupOverlay.style.display = "flex";
          popupSearchInput.focus();
        });

        closeSearchPopup.addEventListener("click", () => {
          searchPopupOverlay.style.display = "none";
          popupSearchInput.value = "";
        });

        searchPopupOverlay.addEventListener("click", (event) => {
          if (event.target === searchPopupOverlay) {
            searchPopupOverlay.style.display = "none";
            popupSearchInput.value = "";
          }
        });

        function triggerSearch() {
          const query = popupSearchInput.value.trim();
          if (query) {
            window.location.href = `./pages/search_results.html?query=${encodeURIComponent(
              query
            )}`;
          } else {
            const messageBox = document.createElement("div");
            messageBox.className = "message-box";
            messageBox.innerHTML = `
                <p data-i18n="enter_keywords_message">Please enter stream title keywords!</p>
                <button class="search-button" onclick="this.parentNode.remove()" data-i18n="ok_button">OK</button>
            `;
            document.body.appendChild(messageBox);
            applyTranslations(); // Apply translations to the message box
          }
        }

        performSearchButton.addEventListener("click", triggerSearch);

        popupSearchInput.addEventListener("keypress", (event) => {
          if (event.key === "Enter") {
            triggerSearch();
          }
        });
      });
    </script>
  </body>
</html>
